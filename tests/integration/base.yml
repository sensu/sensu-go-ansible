---
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - destroy
dependency:
  name: galaxy
driver:
  name: docker
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      remote_tmp: /tmp
      local_tmp: /tmp
    ssh_connection:
      control_path_dir: /tmp
      ssh_args: -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
  env:
    ANSIBLE_REMOTE_TMP: /tmp
    ANSIBLE_LOCAL_TMP: /tmp
    ANSIBLE_SSH_CONTROL_PATH_DIR: /tmp
  lint:
    enabled: false
platforms:
  - name: v6.10.0
    image: quay.io/xlab-steampunk/sensu-go-tests-sensu:6.10.0
    pre_build_image: true
    pull: true
    override_command: false
