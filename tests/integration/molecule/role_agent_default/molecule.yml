---
driver:
  name: docker

scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - verify
    - check
    - destroy

platforms:
  - name: rocky-8
    image: rockylinux:8
    pre_build_image: false
    pull: false
    groups: [agents]
    command: /usr/sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp:exec,mode=1777
    cgroupns_mode: host
    ansible_python_interpreter: /usr/bin/python3.8
    dockerfile: ../../../../docker/rocky-8.docker
      VOLUME ["/sys/fs/cgroup"]
      CMD ["/usr/sbin/init"]

# Upstream container - just to populate the inventory
provisioner:
  inventory:
    hosts:
      all:
        children:
          backends:
            hosts:
              upstream-backend:
