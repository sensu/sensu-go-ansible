scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - destroy

platforms:
  - name: misc-api-cert-rocky-8
    image: rockylinux:8
    pre_build_image: false
    pull: false
    groups: [api]
    command: /usr/sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp:exec,mode=1777
    cgroupns_mode: host
    ansible_python_interpreter: /usr/libexec/platform-python
    dockerfile: ../../../../docker/rocky-8.docker
