---
- name: Test different versions
  hosts: all
  tasks:
    - name: Install a specific version from stable
      include_role:
        name: sensu.sensu_go.install
      vars:
        components: [sensu-go-backend]
        version: 6.10.0

    - name: Verify sensu-go-backend is installed and executable
      command: sensu-backend version
      register: backend_version

    - name: Verify backend version contains expected version string
      assert:
        that:
          - "'6.10.0' in backend_version.stdout"
        fail_msg: "Expected version 6.10.0 in backend output: {{ backend_version.stdout }}"

    - name: Install a different version (agent)
      include_role:
        name: sensu.sensu_go.install
        tasks_from: packages
      vars:
        components: [sensu-go-agent]
        version: 6.9.0

    - name: Verify sensu-go-agent is installed and executable
      command: sensu-agent version
      register: agent_version

    - name: Verify agent version contains expected version string
      assert:
        that:
          - "'6.9.0' in agent_version.stdout"
        fail_msg: "Expected version 6.9.0 in agent output: {{ agent_version.stdout }}"
