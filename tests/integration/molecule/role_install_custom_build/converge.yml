---
- name: Test different version builds
  hosts: all
  tasks:
    - name: Install a specific build
      include_role:
        name: sensu.sensu_go.install
      vars:
        components: [sensu-go-backend]
        channel: testing
        version: 6.8.0
        build: 6646

    - package_facts:
        manager: auto

    - assert:
        that:
          - ansible_facts.packages["sensu-go-backend"][0].version == "6.8.0-6646"
      when: ansible_facts.packages["sensu-go-backend"][0].source == "apt"

    - assert:
        that:
          - ansible_facts.packages["sensu-go-backend"][0].version == "6.8.0"
          - ansible_facts.packages["sensu-go-backend"][0].release == "6646"
      when: ansible_facts.packages["sensu-go-backend"][0].source == "rpm"

    - name: Update to a specific build
      include_role:
        name: sensu.sensu_go.install
        tasks_from: packages
      vars:
        components: [sensu-go-backend]
        channel: testing
        version: 6.9.1
        build: 6927

    - package_facts:
        manager: auto

    - assert:
        that:
          - ansible_facts.packages["sensu-go-backend"][0].version == "6.9.1-6927"
      when: ansible_facts.packages["sensu-go-backend"][0].source == "apt"

    - assert:
        that:
          - ansible_facts.packages["sensu-go-backend"][0].version == "6.9.1"
          - ansible_facts.packages["sensu-go-backend"][0].release == "6927"
      when: ansible_facts.packages["sensu-go-backend"][0].source == "rpm"
