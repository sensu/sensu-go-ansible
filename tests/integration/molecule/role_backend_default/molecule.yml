---
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - check
    - destroy

platforms:
  - name: centos
    image: quay.io/centos/centos:8
    pre_build_image: true
    pull: true
    override_command: false
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
