---
driver:
  name: docker

scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - check
    - destroy

platforms:
  - name: rocky-8
    image: rockylinux:8
    pre_build_image: false
    pull: false
    groups: [backends]
    command: /usr/sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp:exec,mode=1777
    cgroupns_mode: host
    ansible_python_interpreter: /usr/bin/python3.8
    dockerfile: ../../../../docker/rocky-8.docker