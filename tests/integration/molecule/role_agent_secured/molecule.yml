---
driver:
  name: docker
platforms:
  - name: centos
    image: rockylinux:8
    pre_build_image: false
    pull: false
    groups: [agents]
    command: /usr/sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp:exec,mode=1777
    cgroupns_mode: host
    ansible_python_interpreter: /usr/bin/python3.8
    dockerfile: ../../../../docker/rocky-8.docker

# Upstream container - just to populate the inventory
provisioner:
  inventory:
    hosts:
      all:
        children:
          backends:
            hosts:
              upstream-backend:
