---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: centos
    image: quay.io/centos/centos:8
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible