---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: rocky-8
    image: rockylinux:8
    pre_build_image: false
    pull: false
    command: /usr/sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp:exec,mode=1777
    cgroupns_mode: host
    ansible_python_interpreter: /usr/bin/python3.8
    dockerfile: ../../../../docker/rocky-8.docker
provisioner:
  name: ansible
  config_options:
    defaults:
      ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible