---
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - verify
    - check
    - destroy

platforms:
  - name: rocky-8
    dockerfile: ../../../../docker/rocky-8.docker
    image: rockylinux:8
    pre_build_image: false
    pull: false
    command: /usr/sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp:exec,mode=1777
    cgroupns_mode: host

