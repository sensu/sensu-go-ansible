  - name: oracle-8
    dockerfile: ../../../../docker/oracle-8.docker
    image: oraclelinux:8
    pre_build_image: false
    pull: false
    command: /usr/sbin/init
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp:exec,mode=1777
    cgroupns_mode: host
