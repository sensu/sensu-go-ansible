[defaults]
# Use /tmp for temporary files instead of ~/.ansible/tmp
# This avoids permission issues in Docker containers
remote_tmp = /tmp/.ansible-tmp
local_tmp = /tmp/.ansible-tmp

# Disable deprecation warnings for cleaner output
deprecation_warnings = False

# Set inventory to avoid warnings
inventory = localhost,

# Set host key checking to avoid SSH warnings
host_key_checking = False

# Set gathering facts timeout
gathering = smart
fact_caching = memory
