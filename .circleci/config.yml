version: "2.1"

# Machine definition for integration tests
ci-machine: &ci-machine
  image: << parameters.image_ubuntu >>

workflows:
  version: 2
  main_workflow:
    jobs:
      - sanity_test_old:
          matrix: &old_matrix
            parameters:
              ansible: ["2.13.13", "2.15.10"]
              python_version: ["3.10"]
      
      - sanity_test_new:
          matrix: &new_matrix
            parameters:
              ansible: ["2.18.2", "2.19.1"]
              python_version: ["3.13"]

      - unit_test_old:
          matrix: *old_matrix
      
      - unit_test_new:
          matrix: *new_matrix

      - integration_test_git:
          requires:
            - sanity_test_old
            - sanity_test_new
            - unit_test_old
            - unit_test_new
          matrix: &integration_matrix
            parameters:
              ansible: ["2.13.13", "2.15.10", "2.18.2", "2.19.1"]
              image_ubuntu: ["ubuntu-2204:current", "ubuntu-2404:2024.11.1"]

      - integration_test_galaxy:
          filters: { branches: { only: [ stable ] } }
          requires:
            - integration_test_git
          matrix: *integration_matrix

  cron_master:
    triggers:
      - schedule:
          cron: "12 5 * * 0,3"
          filters: { branches: { only: [ master ] } }
    jobs:
      - sanity_test_old:
          matrix: *old_matrix
      
      - sanity_test_new:
          matrix: *new_matrix

      - unit_test_old:
          matrix: *old_matrix
      
      - unit_test_new:
          matrix: *new_matrix

      - integration_test_git:
          requires:
            - sanity_test_old
            - sanity_test_new
            - unit_test_old
            - unit_test_new
          matrix: *integration_matrix

  cron_released:
    triggers:
      - schedule:
          cron: "12 5 * * 1,4"
          filters: { branches: { only: [ stable ] } }
    jobs:
      - sanity_test_old:
          matrix: *old_matrix
      
      - sanity_test_new:
          matrix: *new_matrix

      - unit_test_old:
          matrix: *old_matrix
      
      - unit_test_new:
          matrix: *new_matrix

      - integration_test_git:
          requires:
            - sanity_test_old
            - sanity_test_new
            - unit_test_old
            - unit_test_new
          matrix: *integration_matrix

      - integration_test_galaxy:
          requires:
            - integration_test_git
          matrix: *integration_matrix

  cron_ansible_devel:
    triggers:
      - schedule:
          cron: "12 5 * * 2,5"
          filters: { branches: { only: [ master ] } }
    jobs:
      - sanity_test_new:
          matrix: &devel-matrix
            parameters:
              ansible: [ "devel" ]
              python_version: [ "3.13" ]

      - unit_test_new:
          matrix: *devel-matrix

      - integration_test_git:
          requires:
            - sanity_test_new
            - unit_test_new
          matrix: &devel-integration-matrix
            parameters:
              ansible: [ "devel" ]
              image_ubuntu: [ "ubuntu-2404:2024.11.1" ]

  windows_version_check:
    triggers:
      - schedule:
          cron: "12 3 * * 0,2,4"
          filters: { branches: { only: [ master ] } }
    jobs:
      - windows_version_check

jobs:
  sanity_test_old:
    parameters:
      ansible:
        description: Ansible version to use
        type: string
      python_version:
        description: Python version to use
        type: string
    docker:
      - image: cimg/python:<< parameters.python_version >>
    working_directory: ~/ansible_collections/sensu/sensu_go
    steps:
      - wrapper_docker:
          ansible: << parameters.ansible >>
          kind: sanity
          test_commands:
            - run: make sanity

  sanity_test_new:
    parameters:
      ansible:
        description: Ansible version to use
        type: string
      python_version:
        description: Python version to use
        type: string
    docker:
      - image: cimg/python:<< parameters.python_version >>
    working_directory: ~/ansible_collections/sensu/sensu_go
    steps:
      - wrapper_docker:
          ansible: << parameters.ansible >>
          kind: sanity
          test_commands:
            - run: make sanity

  unit_test_old:
    parameters:
      ansible:
        description: Ansible version to use
        type: string
      python_version:
        description: Python version to use
        type: string
    docker:
      - image: cimg/python:<< parameters.python_version >>
    working_directory: ~/ansible_collections/sensu/sensu_go
    steps:
      - wrapper_docker:
          ansible: << parameters.ansible >>
          kind: unit
          test_commands:
            - run: make units
            - store_artifacts:
                path: tests/output/reports/coverage
                destination: coverage-report
            - store_test_results:
                path: tests/output/junit

  unit_test_new:
    parameters:
      ansible:
        description: Ansible version to use
        type: string
      python_version:
        description: Python version to use
        type: string
    docker:
      - image: cimg/python:<< parameters.python_version >>
    working_directory: ~/ansible_collections/sensu/sensu_go
    steps:
      - wrapper_docker:
          ansible: << parameters.ansible >>
          kind: unit
          test_commands:
            - run: make units
            - store_artifacts:
                path: tests/output/reports/coverage
                destination: coverage-report
            - store_test_results:
                path: tests/output/junit

  integration_test_git:
    parallelism: 6
    parameters:
      ansible:
        description: Ansible version to use
        type: string
      image_ubuntu:
        description: Ubuntu image
        type: string
    machine: *ci-machine
    working_directory: ~/sensu_go
    steps:
      - run:
          command: |
            sudo apt-get update
            sudo apt-get install -y dbus
      - wrapper:
          ansible: << parameters.ansible >>
          kind: integration
          test_commands:
            - run: ansible-galaxy collection build
            - run: ansible-galaxy collection install sensu-sensu_go-*.tar.gz
            - run_integration_tests

  integration_test_galaxy:
    parallelism: 6
    parameters:
      ansible:
        description: Ansible version to use
        type: string
      image_ubuntu:
        description: Ubuntu image
        type: string
    machine: *ci-machine
    working_directory: ~/sensu_go
    steps:
      - wrapper:
          ansible: << parameters.ansible >>
          kind: integration
          test_commands:
            - run: |
                ansible-galaxy collection install \
                  sensu.sensu_go:$(grep version: galaxy.yml | cut -d" " -f2)
            - run_integration_tests

  windows_version_check:
    docker:
      - image: cimg/python:3.10.6
    steps:
      - checkout
      - run: pip3 install pyyaml
      - run: make check_windows_versions

commands:
  run_integration_tests:
    description: Run integration tests
    steps:
      - run: ansible-galaxy collection install community.docker
      - run:
          name: Display scheduled scenarios
          command: |
            circleci tests glob "tests/integration/molecule/*/molecule.yml" \
             | circleci tests split --split-by=timings
      - run: make integration_ci
      - store_test_results:
          path: test_results
      - store_artifacts:
          path: test_results

  wrapper:
    description: Wrapper command that takes care of venv caching
    parameters:
      ansible:
        description: Ansible version to install
        type: string
      kind:
        description: Test kind (used to construct cache name)
        type: string
      test_commands:
        description: Test commands to execute
        type: steps
    steps:
      - checkout: { path: . }
      - run:
          name: Generate cache id file
          command: |
            rm -f cache-id.txt
            echo "week $(date +%V)" >> cache-id.txt
            echo "ansible << parameters.ansible >>" >> cache-id.txt
            echo "kind << parameters.kind >>" >> cache-id.txt
            echo "cache busting string 3" >> cache-id.txt
      - restore_cache:
          key: '{{ checksum "cache-id.txt" }}'
      - run:
          name: Install Ansible
          command: |
            if [ "<< parameters.ansible >>" = "devel" ]; then
              pip3 install git+https://github.com/ansible/ansible.git@devel
            else
              pip3 install "ansible-core==<< parameters.ansible >>"
            fi
      - steps: << parameters.test_commands >>
      - save_cache:
          key: '{{ checksum "cache-id.txt" }}'
          paths:
            - "~/venv"

  wrapper_docker:
    description: Wrapper command for Docker-based jobs
    parameters:
      ansible:
        description: Ansible version to install
        type: string
      kind:
        description: Test kind (used to construct cache name)
        type: string
      test_commands:
        description: Test commands to execute
        type: steps
    steps:
      - checkout: { path: . }
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y git python3.10 python3.10-distutils python3-pip
            # Install pip for Python 3.10 using get-pip.py
            curl https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3.10 get-pip.py
      - run:
          name: Install collection requirements
          command: |
            # Install collection requirements for Python 3.13 (default)
            pip3 install -r collection.requirements
            # Install collection requirements for Python 3.10 (needed for unit tests)
            python3.10 -m pip install -r collection.requirements
            # Install additional dependencies for Python 3.10 (discovered during local testing)
            python3.10 -m pip install pyyaml ansible-core
      - run:
          name: Install Ansible
          command: |
            if [ "<< parameters.ansible >>" = "devel" ]; then
              pip3 install git+https://github.com/ansible/ansible.git@devel
            else
              pip3 install "ansible-core==<< parameters.ansible >>"
            fi
      - steps: << parameters.test_commands >>
